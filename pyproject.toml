[project]
name = "cimple-factors-server"
version = "0.1.0"
description = "A FastAPI server for CIMPLE factors"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.2",
    "numpy>=1.21.0,<2.0",
    "pydantic>=2.11.9",
    "requests>=2.32.5",
    "safetensors>=0.4.5,<0.8.0",
    "torch==1.12.1",
    "tqdm>=4.67.1",
    "transformers>=4.25.1,<4.30.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.13.0",
    "ty>=0.0.1a20",
]
